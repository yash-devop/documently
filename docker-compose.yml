name: documently
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: documently_db
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - "documently_db:/var/lib/postgresql/main"

  redis:
    image: redis:8.10-alpine
    container_name: documently_redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

volumes:
  documently_db:
    external: false
  redis-data:
    driver: local

