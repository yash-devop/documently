name: documently
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: documently_db
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - "documently_db:/var/lib/postgresql/data"

  redis:
    image: redis:8.10-alpine
    container_name: documently_redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: documently-backend
    container_name: documently_server
    restart: unless-stopped
    env_file:
      - apps/server/.env.local
    environment:
      NODE_ENV: production
      # "db" is the compose service name (see db service above); Docker's internal
      # DNS resolves it to the postgres container. localhost would point at the container itself.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # "redis" is the compose service name (see redis service above); same DNS trick.
      REDIS_URL: redis://redis:6379
    command: ["node", "apps/server/dist/index.mjs"]
    ports:
      - "8000:8000"
    depends_on:
      - db # wait for postgres before starting
      - redis # wait for redis before starting

  worker:
    image: documently-backend
    container_name: documently_worker
    restart: unless-stopped
    env_file:
      - apps/worker/.env.local
    environment:
      NODE_ENV: production
      # "db" = compose service name for postgres, so the worker uses the same db as the server.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # "redis" = compose service name for redis, required by BullMQ (job queue).
      REDIS_URL: redis://redis:6379
    command: ["node", "apps/worker/dist/index.mjs"]
    depends_on:
      - db # wait for postgres before starting
      - redis # wait for redis before starting
    volumes:
      # Named volume keeps the downloaded ~22MB embedding model across container recreates.
      - transformers-cache:/app/node_modules/@huggingface/transformers/.cache

volumes:
  documently_db:
    external: false
  redis-data:
    driver: local
  transformers-cache:
