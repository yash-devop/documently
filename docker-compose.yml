name: documently
services:
  db:
    image: postgres:17-alpine
    container_name: documently_db
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - "documently_db:/var/lib/postgresql/main"

volumes:
  documently_db:
    external: false

