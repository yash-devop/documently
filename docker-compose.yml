name: documently
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: documently_db
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - "documently_db:/var/lib/postgresql/data"

  redis:
    image: redis:8.10-alpine
    container_name: documently_redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: emberbuild/documently-backend:latest
    container_name: documently_server
    restart: unless-stopped
    env_file:
      - .env.${ENV_FILE:-local}
    environment:
      # Defaults to production so EC2 is unaffected; set NODE_ENV=development in the
      # shell (or use compose:up:dev) for verbose Prisma errors when running locally.
      NODE_ENV: ${NODE_ENV:-production}
      # DATABASE_URL is NOT overridden here on purpose: the server/worker read the
      # exact same value that `pnpm prisma:prod` and local `pnpm dev` read, straight
      # from the env file. One variable = migrations and the app can never disagree.
      #   local      -> .env.local      -> localhost:5432 (db container, published to host)
      #   production -> .env.production -> your managed database
      #
      # "redis" is the compose service name (see redis service above); Docker's internal
      # DNS resolves it to the redis container. Redis is always a container, so this
      # override is safe in every environment.
      REDIS_URL: redis://redis:6379
    command: ["node", "apps/server/dist/index.mjs"]
    ports:
      - "8000:8000"
    depends_on:
      - db # wait for postgres before starting
      - redis # wait for redis before starting

  worker:
    image: emberbuild/documently-backend:latest
    container_name: documently_worker
    restart: unless-stopped
    env_file:
      - .env.${ENV_FILE:-local}
    environment:
      # See server service above. DATABASE_URL comes from the env file unchanged.
      NODE_ENV: ${NODE_ENV:-production}
      # Redis is always the compose container, so this override is environment-independent.
      REDIS_URL: redis://redis:6379
    command: ["node", "apps/worker/dist/index.mjs"]
    depends_on:
      - db # wait for postgres before starting
      - redis # wait for redis before starting
    volumes:
      # Named volume keeps the downloaded ~22MB embedding model across container recreates.
      - transformers-cache:/app/node_modules/@huggingface/transformers/.cache

volumes:
  documently_db:
    external: false
  redis-data:
    driver: local
  transformers-cache:
